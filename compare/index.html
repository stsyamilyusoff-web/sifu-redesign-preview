  <!-- sifu-brand-pass -->
<style>
  body, button, input { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif !important; }
  .sifu-hub-link, .sifu-fit-btn{
    position:fixed;bottom:16px;z-index:9999;display:inline-flex;align-items:center;gap:7px;
    font-size:13px;font-weight:700;text-decoration:none;border:0;cursor:pointer;
    border-radius:999px;padding:10px 16px;box-shadow:0 6px 18px rgba(43,47,190,.35);
  }
  .sifu-hub-link{left:16px;background:#2B2FBE;color:#fff}
  .sifu-hub-link:hover{filter:brightness(1.1)}
  .sifu-fit-btn{left:172px;background:#fff;color:#2B2FBE;border:1.5px solid #2B2FBE;display:none}
  .sifu-fit-btn.show{display:inline-flex}
</style>
<a class="sifu-hub-link" href="../index.html">&larr; Back to the hub</a>
<button class="sifu-fit-btn" id="sifuFit">Fit: on</button>
<script>
(function(){
  var fitOn = true;
  var btn = document.getElementById('sifuFit');
  function stageEls(){
    return { scroller: document.querySelector('.gddkb21'), stage: document.querySelector('.gddkb23') };
  }
  function apply(){
    var els = stageEls();
    // measure the visible viewer box (stage > wrapper > box): offset/scroll dims are
    // layout-space (ignore transform), and the box excludes reg-cli's hidden
    // preloader row, whose invisible images pollute the wrapper's scrollWidth
    var box = els.stage && els.stage.firstElementChild && els.stage.firstElementChild.firstElementChild;
    var naturalH = box ? Math.max(box.offsetHeight, box.scrollHeight) : 0;
    var naturalW = box ? Math.max(box.offsetWidth, box.scrollWidth) : 0;
    if (!els.scroller || !els.stage || naturalH < 100) { btn.classList.remove('show'); return; }
    btn.classList.add('show');
    var availH = els.scroller.clientHeight - 165; // header row + floating controls
    var availW = els.scroller.clientWidth - 48;
    var z = fitOn ? Math.min(1, availH / naturalH, availW / naturalW) : 1;
    if (z < 1) {
      els.stage.style.transform = 'scale(' + z + ')';
      els.stage.style.transformOrigin = 'top center';
      els.stage.style.marginBottom = -(naturalH * (1 - z)) + 'px'; // reclaim the empty layout space
      els.scroller.scrollTop = 0;
    } else {
      els.stage.style.transform = '';
      els.stage.style.marginBottom = '';
    }
  }
  // content settles asynchronously (mode switches relayout cached images without
  // load events), so re-check a few times after every trigger
  function applySoon(){
    apply();
    [150, 400, 900].forEach(function(ms){ setTimeout(apply, ms); });
  }
  btn.addEventListener('click', function(){
    fitOn = !fitOn;
    btn.textContent = fitOn ? 'Fit: on' : 'Fit: off';
    apply();
  });
  var raf;
  var mo = new MutationObserver(function(){ cancelAnimationFrame(raf); raf = requestAnimationFrame(applySoon); });
  mo.observe(document.body, { childList: true, subtree: true });
  window.addEventListener('resize', applySoon);
  document.addEventListener('load', function(e){ if (e.target.tagName === 'IMG') applySoon(); }, true);
  if (!stageEls().scroller) console.warn('sifu fit: reg-cli class names changed; fit disabled');
  apply();
})();
</script>
