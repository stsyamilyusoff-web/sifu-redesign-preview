name: Build and deploy the design-system site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
        env:
          SITE_BASE: /sifu-redesign-preview
      - name: Assemble artifact (site pages over static assets)
        run: |
          mkdir -p /tmp/out
          rsync -a --exclude site --exclude .git --exclude .github ./ /tmp/out/
          rsync -a site/dist/ /tmp/out/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/out
      - id: deployment
        uses: actions/deploy-pages@v4
