<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sifututor · Status map</title>
<style>
:root{
  /* hub-consistent tokens (single source: index.html) */
  --brand:#2B2FBE;--brand2:#3A3FE0;--brand-soft:#EEF0FE;--brand-line:#D7DAFB;
  --ink:#15161C;--ink-2:#3D414C;--muted:#6B7280;--faint:#9AA0AC;
  --line:#E5E8EF;--line-2:#EEF1F6;--bg:#F5F7FB;--card:#FFFFFF;
  --shadow:0 1px 2px rgba(21,22,28,.04), 0 8px 24px rgba(21,22,28,.06);
  --shadow-hover:0 2px 6px rgba(43,47,190,.10), 0 18px 44px rgba(43,47,190,.16);
  --green:#1A5C38;--greenbg:#E8F5EE;--blue:#2B2FBE;--bluebg:#EEF0FE;
  --grey:#71717A;--greybg:#F1F2F5;--amber:#9A3412;--amberbg:#FDF2E3;--red:#B91C1C;--redbg:#FDEAEA;
  --star:#B45309;--starbg:#FEF6E7;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:1240px;margin:0 auto;padding:28px 24px 80px}
.head{
  background:linear-gradient(140deg,var(--brand) 0%,#3A3FE0 58%,#4F54F2 100%);color:#fff;
  border-radius:24px;padding:34px 36px;position:relative;overflow:hidden;
  box-shadow:0 18px 50px rgba(43,47,190,.28);
}
.head::after{content:"";position:absolute;right:-70px;top:-90px;width:320px;height:320px;border-radius:50%;
  background:radial-gradient(circle at center, rgba(255,255,255,.16), rgba(255,255,255,0) 70%)}
.head .kick{font-size:12.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;opacity:.82}
.head h1{font-size:32px;font-weight:800;margin:8px 0 6px;letter-spacing:-.4px}
.head .ns{font-size:15px;opacity:.92;max-width:710px;line-height:1.55;min-height:40px;position:relative;z-index:2}
.head .ns b{font-weight:800}
.apptabs{display:flex;gap:10px;margin-top:20px;position:relative;z-index:2;flex-wrap:wrap}
.apptab{font-size:13px;font-weight:700;padding:9px 16px;border-radius:999px;background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.28);cursor:pointer;backdrop-filter:saturate(140%) blur(2px)}
.apptab.on{background:#fff;color:var(--brand);border-color:#fff}
a.hublink{
  position:absolute;right:36px;top:34px;z-index:3;display:inline-flex;align-items:center;gap:8px;
  background:#fff;color:var(--brand);font-weight:800;font-size:13.5px;border-radius:999px;
  padding:11px 18px;box-shadow:0 6px 18px rgba(0,0,0,.14);transition:transform .12s ease;
}
a.hublink:hover{transform:translateY(-1px)}
.glancewrap{margin-top:18px}
.glance{padding:22px 24px}
.gbig{font-size:29px;font-weight:800;letter-spacing:-.5px;line-height:1.25;margin-bottom:14px}
.gbig b{color:var(--brand)}
.grows{margin-top:16px;display:flex;flex-direction:column;gap:9px}
.grow{display:flex;align-items:baseline;gap:9px;font-size:13.5px;color:var(--ink-2);flex-wrap:wrap;line-height:1.5}
.grow .gk{font-weight:800;font-size:12px;border-radius:999px;padding:3px 11px;white-space:nowrap}
.gk.now{background:var(--bluebg);color:var(--blue)}
.gk.todo{background:var(--amberbg);color:var(--amber)}
.gk.retire{background:var(--greybg);color:var(--grey)}
.gk.ok{background:var(--greenbg);color:var(--green)}
.gname{font-weight:700;color:var(--brand);cursor:pointer;border-bottom:1px dashed var(--brand-line)}
.gname:hover{border-bottom-style:solid}
.dash{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;margin-top:18px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow)}
.panel h3{margin:0 0 12px;font-size:11.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
.bar{height:18px;border-radius:8px;overflow:hidden;display:flex;border:1px solid var(--line)}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:13px;margin-top:11px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block}
.big{font-size:26px;font-weight:800;letter-spacing:-.6px}
.phaserow{display:flex;align-items:center;gap:6px;font-size:12px;margin-top:9px;flex-wrap:wrap}
.ph{padding:3px 10px;border-radius:999px;font-weight:700;font-size:11px}
.ph.done{background:var(--greenbg);color:var(--green)}.ph.now{background:var(--bluebg);color:var(--blue)}.ph.next{background:var(--greybg);color:var(--grey)}
.tools{display:flex;gap:9px;margin:18px 0 6px;flex-wrap:wrap;position:sticky;top:0;z-index:20;background:rgba(245,247,251,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:10px 0}
.search{flex:1;min-width:230px;display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 14px;box-shadow:var(--shadow)}
.search input{border:0;outline:0;font-size:14px;padding:12px 0;width:100%;background:transparent;color:var(--ink)}
.sel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 10px;font-size:13px;font-weight:600;color:var(--ink);box-shadow:var(--shadow)}
.sel select{border:0;outline:0;background:transparent;font-size:13px;font-weight:700;padding:12px 4px;color:var(--ink-2)}
.rescount{font-size:12px;color:var(--muted);align-self:center;padding-left:4px}
.spinewrap{margin:16px 0 6px}
.spinelbl{font-size:11.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.spine{display:grid;gap:8px}
.schip{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 9px;text-align:center;cursor:pointer;position:relative;transition:transform .14s ease, box-shadow .14s ease, border-color .14s ease;box-shadow:var(--shadow)}
.schip:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px);border-color:var(--brand-line)}
.schip.star{border-color:#E7B75E;box-shadow:0 0 0 2px var(--starbg)}
.schip .n{font-size:10.5px;color:var(--faint);font-weight:700}
.schip .nm{font-size:13px;font-weight:800;margin:2px 0 1px;line-height:1.2}
.schip .cnt{font-size:10.5px;color:var(--muted)}
.schip .tag{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:800;padding:2px 8px;border-radius:999px;white-space:nowrap;text-transform:uppercase;letter-spacing:.3px}
.tag.done{background:var(--green);color:#fff}.tag.now{background:var(--blue);color:#fff}.tag.next{background:#A1A1AA;color:#fff}
.stage{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-top:16px;scroll-margin-top:70px;box-shadow:var(--shadow)}
.stage.star{border-color:#E7B75E}
.stagehd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;cursor:pointer}
.stagehd .l{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.stagehd .num{font-size:12px;font-weight:800;color:var(--brand);background:var(--brand-soft);border:1px solid var(--brand-line);border-radius:8px;padding:3px 9px;letter-spacing:.4px}
.stagehd .t{font-size:18px;font-weight:800;letter-spacing:-.2px}
.stagehd .t .star{color:var(--star)}
.stagehd .tag{font-size:10px;font-weight:800;padding:2px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.3px}
.stagehd .role{font-size:12.5px;color:var(--muted);font-weight:500}
.stagehd .toggle{font-size:12px;color:var(--faint);font-weight:700}
.cluster{margin-top:16px}
.cluster .ch{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line-2);padding-bottom:8px;margin-bottom:12px}
.cluster .ct{font-size:13.5px;font-weight:800}
.cluster .cd{font-size:12px;color:var(--muted);font-weight:500}
.cluster .briefs{display:flex;gap:6px;flex-wrap:wrap}
.briefbtn{font-size:11.5px;font-weight:700;color:var(--brand);background:var(--brand-soft);border:1px solid var(--brand-line);border-radius:999px;padding:6px 12px;white-space:nowrap;transition:.12s}
.briefbtn:hover{background:#DFE4FD}
.flow{display:flex;flex-wrap:wrap;gap:13px}
.node{width:128px;cursor:pointer;transition:transform .12s ease}
.node:hover{transform:translateY(-3px)}
.thumb{height:184px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:linear-gradient(170deg,#FBFCFF 0%,#EEF1F8 100%);display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 8px 22px rgba(21,22,28,.08)}
.node:hover .thumb{box-shadow:var(--shadow-hover);border-color:var(--brand-line)}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top}
.thumb .holder{font-size:11px;color:var(--faint);text-align:center;padding:10px;line-height:1.35;font-weight:600}
.thumb .holder .sm{font-size:9.5px;opacity:.7;font-weight:500;display:block;margin-top:6px}
.thumb .p0{position:absolute;top:6px;left:6px;background:var(--red);color:#fff;font-size:8.5px;font-weight:800;border-radius:5px;padding:1px 5px;letter-spacing:.3px}
.node .cn{font-weight:700;font-size:12px;margin:7px 1px 2px;line-height:1.25}
.node .meta{display:flex;gap:4px;flex-wrap:wrap;margin:2px 1px}
.pill{font-size:9px;font-weight:800;border-radius:999px;padding:2px 7px;text-transform:uppercase;letter-spacing:.2px}
.tab{font-size:9px;font-weight:700;color:var(--muted);background:var(--greybg);border-radius:999px;padding:2px 7px}
.collapsed .flow,.collapsed .cluster{display:none}
.note{margin-top:20px;font-size:12.5px;color:var(--ink-2);background:var(--brand-soft);border:1px solid var(--brand-line);border-radius:14px;padding:13px 15px;line-height:1.6}
.note b{color:var(--brand)}
.foot{font-size:12px;color:var(--faint);text-align:center;margin-top:28px;line-height:1.7}
.lb{position:fixed;inset:0;background:rgba(13,15,35,.62);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:50;padding:24px}
.lb.on{display:flex}
.lbcard{background:var(--card);border-radius:20px;max-width:760px;width:100%;max-height:92vh;overflow:auto;display:grid;grid-template-columns:300px 1fr;gap:0;box-shadow:0 30px 90px rgba(0,0,0,.4)}
.lbcard img{width:100%;display:block;border-right:1px solid var(--line)}
.lbholder{display:flex;align-items:center;justify-content:center;background:linear-gradient(170deg,#FBFCFF 0%,#EEF1F8 100%);color:var(--faint);font-size:12px;padding:30px;text-align:center;border-right:1px solid var(--line)}
.lbinfo{padding:22px 24px}
.lbinfo .x{float:right;font-size:20px;color:var(--muted);cursor:pointer;line-height:1}
.lbinfo .x:hover{color:var(--ink)}
.lbinfo h4{margin:0 0 4px;font-size:19px;font-weight:800;letter-spacing:-.2px}
.lbinfo .sub{font-size:12px;color:var(--muted);margin-bottom:14px}
.lbinfo .row{font-size:13px;margin:9px 0;display:flex;gap:8px;align-items:center}
.lbinfo .row b{min-width:74px;color:var(--muted);font-weight:700}
.lbinfo .d{font-size:13.5px;color:var(--ink-2);margin:14px 0;line-height:1.55}
.lbinfo .open{display:inline-block;margin-top:6px;font-size:13px;font-weight:700;color:#fff;background:var(--brand);border-radius:10px;padding:9px 15px;box-shadow:0 2px 8px rgba(43,47,190,.3)}
.lbinfo .open:hover{filter:brightness(1.08)}
@media(max-width:560px){
  .wrap{padding:18px 14px 60px}
  .head{padding:26px 22px}
  .head h1{font-size:25px}
  a.hublink{position:static;margin-top:14px;width:100%;justify-content:center;display:flex}
  .dash{grid-template-columns:1fr}
  .lbcard{grid-template-columns:1fr}.lbcard img,.lbholder{border-right:0;border-bottom:1px solid var(--line)}
}
</style></head><body><div class="wrap">

<div class="head">
  <a class="hublink" href="index.html">&larr; Design catalogue</a>
  <div class="kick">Sifututor · Redesign program</div>
  <h1>Status map</h1>
  <div class="ns" id="ns"></div>
  <div class="apptabs">
    <div class="apptab on" data-app="tutor">Tutor app · <span class="ac" data-app="tutor"></span></div>
    <div class="apptab" data-app="customer">Customer app · <span class="ac" data-app="customer"></span></div>
  </div>
</div>

<div class="glancewrap">
  <div class="panel glance">
    <div class="gbig" id="gbig"></div>
    <div class="bar" id="progbar"></div>
    <div class="legend" id="legend"></div>
    <div class="grows" id="grows"></div>
  </div>
</div>

<div class="tools">
  <div class="search">🔍<input id="q" placeholder="Find any screen, flow, or status…" autocomplete="off"></div>
  <div class="sel"><select id="fstage"><option value="">All stages</option></select></div>
  <div class="sel"><select id="fstatus"><option value="">All status</option></select></div>
  <div class="sel"><select id="ftab"><option value="">All tabs</option></select></div>
  <div class="rescount" id="rescount"></div>
</div>

<div class="spinewrap">
  <div class="spinelbl" id="spinelbl"></div>
  <div class="spine" id="spine"></div>
</div>

<div id="stages"></div>

<div class="note" id="note"></div>
<div style="text-align:center;margin-top:18px" id="detaillink"></div>
<div class="foot">Sifututor · redesign system · tutor screens are real baseline captures (personal data redacted); customer screens link to their before/after mockups. Previews are design mockups, not the live app.</div>

</div>

<div class="lb" id="lb"><div class="lbcard" id="lbcard"></div></div>

<script src="tutor-screens-data.js"></script>
<script src="tutor-thumbs.js"></script>
<script src="customer-screens-data.js"></script>
<script>
(function(){
  var APPS={
    tutor:{
      name:"Tutor app", cats:window.TUTOR_CATS, stages:window.TUTOR_STAGES,
      label:window.TUTOR_LABEL,
      statusOrder:["pass","briefed","floored","baseline","deprecated"],
      statusColor:{pass:"#15803d",briefed:"#1a5c38",floored:"#2B2FBE",baseline:"#a1a1aa",deprecated:"#d8923f"},
      statusLabel:{pass:"Ready to build",briefed:"Waiting for design",floored:"Needs polish",baseline:"Not started",deprecated:"Retiring"},
      thumbs:window.TUTOR_THUMBS||{}, hasThumbs:true, briefBase:"",
      ns:'North Star: <b>increase intelligent request applications</b> — fit tutors applying to fit requests, with less friction and smarter surfacing. Every screen earns its place by moving a funnel number.',
      where:'<div class="big">Phase 2 · Activate</div><div class="phaserow"><span class="ph done">✓ P1 Participate</span><span class="ph now">→ P2 Activate</span><span class="ph next">P3 Deliver</span><span class="ph next">P4 Grow</span><span class="ph next">Tail</span></div><div style="font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5">Phases run in <b>funnel-impact</b> order (the North Star first), not screen order.</div>',
      spinelbl:"The tutor's journey — the spine of the whole app (click to jump)",
      note:'<b>How the briefs fit in:</b> every redesign brief is attached to the stage + cluster it covers (the buttons beside each cluster). Screens are the atomic unit; the briefs go deeper. Click any tile to see it bigger.',
      detail:'<a href="tutor-current-screens.html" target="_blank" class="briefbtn" style="font-size:13px;padding:10px 18px">See all 91 current tutor screens as one compilation →</a>'
    },
    customer:{
      name:"Customer app", cats:window.CUSTOMER_CATS, stages:window.CUSTOMER_STAGES,
      label:window.CUSTOMER_LABEL,
      statusOrder:["briefed","pass","shared","demoted"],
      statusColor:window.CUSTOMER_STATUS_COLOR,
      statusLabel:window.CUSTOMER_STATUS_LABEL,
      thumbs:{}, hasThumbs:false, briefBase:window.CUSTOMER_BRIEF_BASE,
      ns:'North Star: <b>retained paying parents past month 1</b> — a trustworthy match, classes that actually happen, and proof their child is improving, so they keep paying with confidence.',
      where:'<div class="big">Design complete</div><div class="phaserow"><span class="ph done">✓ All 44 mocked</span><span class="ph now">→ Hafiz review</span><span class="ph next">Build (team)</span></div><div style="font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5">Every screen has a before/after + a comment box on the <b>customer hub</b> (tiles link out).</div>',
      spinelbl:"The parent's journey — the spine of the whole app (click to jump)",
      note:'<b>Customer detail lives on the customer hub.</b> Each tile links to its before/after page (with Hafiz\'s per-screen comment box). The parent app has no baseline screenshots yet, so tiles show the screen name and route out to the mockup.',
      detail:'<a href="https://stsyamilyusoff-web.github.io/sifu-customer-preview/" target="_blank" class="briefbtn" style="font-size:13px;padding:10px 18px">Open the full customer hub (per-screen before/after + comments) →</a>'
    }
  };
  function san(x){return (x||"").replace(/[^A-Za-z0-9]/g,"");}
  function lastSeg(x){var p=(x||"").split(" / ");return p[p.length-1];}
  var TNAMEIDX={}; Object.keys(APPS.tutor.thumbs).forEach(function(k){var nm=k.substring(k.indexOf("-")+1);TNAMEIDX[san(nm)]=k;TNAMEIDX[san(nm).toLowerCase()]=k;});
  // fallback: fresh compare-catalog shots for nodes with no live capture thumb
  var CTHUMB={
    "Splash":"compare/after/acquire-Splash.png",
    "ServicePreference / Step3 (AvailabilitySlots)":"compare/after/activate-AvailabilitySlots.png",
    "SetHomeLocationPin":"compare/after/activate-SetHomeLocationPin.png",
    "SetTeachingArea":"compare/after/activate-SetTeachingArea.png",
    "Application submitted":"compare/after/activate-VerificationSubmittedSuccess.png",
    "ExtendClass":"compare/after/deliver-ExtraClass.png",
    "ActiveClass / ClockInBody":"compare/after/deliver-ActiveClassClockIn.png",
    "ActiveClass / InProgressBody":"compare/after/deliver-ActiveClass.png",
    "ActiveClass / SubmitProofBody":"compare/after/deliver-ActiveClassClockOut.png",
    "ActiveClass / DoneBody":"compare/after/deliver-ActiveClassDone.png",
    "ClockInScreen / ClockIn":"compare/after/deliver-ActiveClassClockIn.png",
    "ClockOutScreen":"compare/after/deliver-ActiveClassClockOut.png",
    "CameraScreen":"compare/after/deliver-CameraScreen.png",
    "SharedRequestDetail":"compare/after/participate-RequestDetails.png",
    "ApplyConfirmSheet":"compare/after/participate-ApplyConfirmSheet.png",
    "SubjectPicker":"compare/after/participate-SubjectPicker.png",
    "LocationPinSheet":"compare/after/participate-LocationPinSheet.png",
    "PolicyScreen":"compare/after/static-PrivacyPolicy.png"
  };
  function thumbFor(app,catKey,s){
    if(app.hasThumbs&&CTHUMB[s.n])return CTHUMB[s.n];
    if(!app.hasThumbs)return null;
    if(s.cap&&app.thumbs[s.cap])return app.thumbs[s.cap];
    var T=app.thumbs,n=s.n,t;
    t=T[catKey+"-"+san(n)]; if(t)return t;
    t=T[catKey+"-"+san(lastSeg(n))]; if(t)return t;
    var k=TNAMEIDX[san(n)]||TNAMEIDX[san(lastSeg(n))]||TNAMEIDX[san(n).toLowerCase()]||TNAMEIDX[san(lastSeg(n)).toLowerCase()];
    return k?T[k]:null;
  }
  var elNs=document.getElementById("ns"),elTot=document.getElementById("totscr"),elBar=document.getElementById("progbar"),
      elLeg=document.getElementById("legend"),elBig=document.getElementById("gbig"),elGrows=document.getElementById("grows"),elSpine=document.getElementById("spine"),
      elSpineLbl=document.getElementById("spinelbl"),elStages=document.getElementById("stages"),elNote=document.getElementById("note"),
      elDetail=document.getElementById("detaillink"),fstage=document.getElementById("fstage"),fstatus=document.getElementById("fstatus"),
      ftab=document.getElementById("ftab"),q=document.getElementById("q"),rc=document.getElementById("rescount");
  var ACTIVE="tutor";

  function render(appKey){
    ACTIVE=appKey; var app=APPS[appKey];
    document.querySelectorAll(".apptab").forEach(function(t){t.classList.toggle("on",t.dataset.app===appKey);});
    elNs.innerHTML=app.ns; elSpineLbl.textContent=app.spinelbl;
    elNote.innerHTML=app.note; elDetail.innerHTML=app.detail;
    elSpine.style.gridTemplateColumns="repeat("+app.stages.length+",1fr)";
    // counts
    var all=[]; app.cats.forEach(function(c){c.screens.forEach(function(s){all.push({c:c,s:s});});});
    var total=all.length; if(elTot) elTot.textContent=total;
    var counts={}; app.statusOrder.forEach(function(k){counts[k]=0;}); all.forEach(function(x){counts[x.s.s]=(counts[x.s.s]||0)+1;});
    elBar.innerHTML=""; elLeg.innerHTML="";
    app.statusOrder.forEach(function(k){ if(!counts[k])return;
      var i=document.createElement("i"); i.style.width=(counts[k]/total*100)+"%"; i.style.background=app.statusColor[k]; elBar.appendChild(i);
      var sp=document.createElement("span"); sp.innerHTML='<i class="dot" style="background:'+app.statusColor[k]+'"></i>'+counts[k]+' '+app.statusLabel[k]; elLeg.appendChild(sp);
    });
    // the glance answer: one plain sentence + what needs attention, by name
    if(appKey==="tutor"){
      var ready=counts["pass"]||0;
      elBig.innerHTML="<b>"+ready+" of "+total+"</b> tutor screens are ready to build.";
      var todo=[]; app.cats.forEach(function(c){c.screens.forEach(function(s){
        if(s.s==="briefed"||s.s==="floored"||s.s==="baseline") todo.push(s.n.indexOf(" / ")>=0?s.n.split(" / ")[1]:s.n);});});
      var todoHtml=todo.map(function(n){return '<span class="gname" data-q="'+n+'">'+n+'</span>';}).join(" · ");
      elGrows.innerHTML=
        '<div class="grow"><span class="gk now">Designing now</span> Activate — the verification on-ramp (the stage after sign-up)</div>'+
        '<div class="grow"><span class="gk todo">Still to design ('+todo.length+')</span> <span>'+todoHtml+'</span></div>'+
        '<div class="grow"><span class="gk retire">'+(counts["deprecated"]||0)+' retiring</span> old screens whose job moved into the new designs</div>';
      elGrows.querySelectorAll(".gname").forEach(function(el){
        el.onclick=function(){q.value=el.dataset.q;apply();window.scrollTo({top:document.querySelector(".tools").offsetTop-10,behavior:"smooth"});};
      });
    } else {
      elBig.innerHTML="All <b>"+total+"</b> customer screens are designed.";
      elGrows.innerHTML='<div class="grow"><span class="gk ok">With Hafiz</span> every screen has a before/after + comment box on the customer hub (tiles link out)</div>';
    }
    // filters
    fstage.innerHTML='<option value="">All stages</option>'; app.stages.forEach(function(st){var o=document.createElement("option");o.value=st.key;o.textContent=st.t;fstage.appendChild(o);});
    fstatus.innerHTML='<option value="">All status</option>'; app.statusOrder.forEach(function(k){var o=document.createElement("option");o.value=k;o.textContent=app.statusLabel[k];fstatus.appendChild(o);});
    var tabs=[]; app.cats.forEach(function(c){if(tabs.indexOf(c.tab)<0)tabs.push(c.tab);});
    ftab.innerHTML='<option value="">All tabs</option>'; tabs.forEach(function(t){var o=document.createElement("option");o.value=t;o.textContent=t+" tab";ftab.appendChild(o);});
    q.value="";
    // spine
    elSpine.innerHTML="";
    app.stages.forEach(function(st){
      var cats=app.cats.filter(function(c){return c.stage===st.key;});
      var scr=[]; cats.forEach(function(c){scr=scr.concat(c.screens);});
      var cc={}; app.statusOrder.forEach(function(k){cc[k]=0;}); scr.forEach(function(s){cc[s.s]=(cc[s.s]||0)+1;});
      var sb=""; app.statusOrder.forEach(function(k){if(cc[k])sb+='<i style="width:'+(cc[k]/scr.length*100)+'%;background:'+app.statusColor[k]+'"></i>';});
      var el=document.createElement("div"); el.className="schip"+(st.star?" star":"");
      var ptxt=st.phaseClass==='done'?'Done':st.phaseClass==='now'?'Designing now':'Later';
      el.innerHTML='<span class="tag '+st.phaseClass+'">'+ptxt+'</span><div class="n">'+st.num+'</div><div class="nm">'+st.t+(st.star?' ★':'')+'</div><div class="cnt">'+scr.length+' screens</div><div class="sbar">'+sb+'</div>';
      el.onclick=function(){var tgt=document.getElementById("stage-"+st.key); if(tgt){tgt.classList.remove("collapsed"); tgt.scrollIntoView({behavior:"smooth",block:"start"});}};
      elSpine.appendChild(el);
    });
    // stages
    elStages.innerHTML="";
    var openKey = appKey==="tutor"?"participate":"match";
    app.stages.forEach(function(st){
      var cats=app.cats.filter(function(c){return c.stage===st.key;}); if(!cats.length)return;
      var scrN=0; cats.forEach(function(c){scrN+=c.screens.length;});
      var sec=document.createElement("section"); sec.className="stage"+(st.star?" star":""); sec.id="stage-"+st.key;
      if(st.key!==openKey) sec.className+=" collapsed";
      var clustersHtml="";
      cats.forEach(function(c){
        var briefs=(c.briefs||[]).map(function(b){return '<a class="briefbtn" href="'+app.briefBase+b.href+'" target="_blank">'+b.label+' · before → after →</a>';}).join("");
        var briefUrl=(c.briefs&&c.briefs[0])?(app.briefBase+c.briefs[0].href):"";
        var nodes=c.screens.map(function(s){
          var t=thumbFor(app,c.key,s);
          var thumb=t?'<img src="'+t+'" alt="'+s.n+'" loading="lazy">':'<div class="holder">'+(s.n.indexOf(" / ")>=0?s.n.split(" / ")[1]:s.n)+'<span class="sm">'+(app.hasThumbs?'in-flow screen':'open before / after →')+'</span></div>';
          var disp=s.n.indexOf(" / ")>=0?s.n.split(" / ")[1]:s.n;
          return '<div class="node" data-name="'+(s.n+" "+s.d).toLowerCase().replace(/"/g,'')+'" data-status="'+s.s+'" data-tab="'+c.tab+'" data-stage="'+st.key+'" '+
                 'data-full="'+s.n.replace(/"/g,'')+'" data-desc="'+s.d.replace(/"/g,'')+'" data-cat="'+c.t.replace(/"/g,'')+'" data-thumb="'+(t||"")+'" data-p0="'+(s.p0?1:0)+'" data-brief="'+briefUrl+'" data-mock="'+(s.m||"")+'">'+
                 '<div class="thumb">'+(s.p0?'<span class="p0">P0 fix</span>':'')+thumb+'</div>'+
                 '<div class="cn">'+disp+'</div><div class="meta"><span class="pill" style="background:'+statusBg(app,s.s)+';color:'+app.statusColor[s.s]+'">'+app.label[s.s]+'</span><span class="tab">'+c.tab+'</span></div></div>';
        }).join("");
        clustersHtml+='<div class="cluster" data-cluster="'+c.key+'"><div class="ch"><div><span class="ct">'+c.t+'</span> &nbsp;<span class="cd">'+c.desc+'</span></div><div class="briefs">'+(briefs||'<span class="cd" style="opacity:.6">no brief yet</span>')+'</div></div><div class="flow">'+nodes+'</div></div>';
      });
      var stTagBg=st.phaseClass==="done"?"var(--greenbg)":st.phaseClass==="now"?"var(--bluebg)":"var(--greybg)";
      var stTagFg=st.phaseClass==="done"?"var(--green)":st.phaseClass==="now"?"var(--blue)":"var(--grey)";
      sec.innerHTML='<div class="stagehd"><div class="l"><span class="num">Stage '+st.num+'</span><span class="t">'+st.t+(st.star?' <span class="star">★ North Star</span>':'')+'</span><span class="tag" style="background:'+stTagBg+';color:'+stTagFg+'">'+(st.phaseClass==='done'?'Done':st.phaseClass==='now'?'Designing now':'Later')+'</span><span class="role">'+st.role+' · '+scrN+' screens</span></div><div class="toggle">▾ toggle</div></div>'+clustersHtml;
      sec.querySelector(".stagehd").onclick=function(){sec.classList.toggle("collapsed");};
      elStages.appendChild(sec);
    });
    apply();
  }
  function statusBg(app,s){ // light bg for the pill from the status color
    var m={"#15803d":"var(--greenbg)","#1a5c38":"var(--greenbg)","#2B2FBE":"var(--bluebg)","#a1a1aa":"var(--greybg)","#d8923f":"var(--amberbg)"};
    return m[app.statusColor[s]]||"var(--greybg)";
  }
  function apply(){
    var qq=q.value.trim().toLowerCase(),vs=fstage.value,vst=fstatus.value,vt=ftab.value,shown=0,total=0,filtering=qq||vs||vst||vt;
    document.querySelectorAll(".stage").forEach(function(sec){
      var anyStage=false;
      sec.querySelectorAll(".cluster").forEach(function(cl){
        var anyCl=false;
        cl.querySelectorAll(".node").forEach(function(nd){
          total++;
          var ok=(!qq||nd.dataset.name.indexOf(qq)>=0||nd.dataset.full.toLowerCase().indexOf(qq)>=0)&&(!vs||nd.dataset.stage===vs)&&(!vst||nd.dataset.status===vst)&&(!vt||nd.dataset.tab===vt);
          nd.style.display=ok?"":"none"; if(ok){anyCl=true;anyStage=true;shown++;}
        });
        cl.style.display=anyCl?"":"none";
      });
      if(filtering){sec.classList.remove("collapsed");sec.style.display=anyStage?"":"none";}
      else{sec.style.display="";}
    });
    rc.textContent=filtering?(shown+" of "+total+" screens"):"";
  }
  [q,fstage,fstatus,ftab].forEach(function(e){e.addEventListener("input",apply);e.addEventListener("change",apply);});
  document.querySelectorAll(".apptab").forEach(function(t){t.addEventListener("click",function(){if(t.dataset.app!==ACTIVE)render(t.dataset.app);window.scrollTo({top:0,behavior:"smooth"});});});
  // lightbox
  var lb=document.getElementById("lb"),lbc=document.getElementById("lbcard");
  elStages.addEventListener("click",function(e){
    var nd=e.target.closest(".node"); if(!nd)return;
    var app=APPS[ACTIVE], t=nd.dataset.thumb, brief=nd.dataset.brief, mock=nd.dataset.mock;
    var img=t?'<img src="'+t+'">':'<div class="lbholder">'+nd.dataset.full+'<br>'+(app.hasThumbs?'(in-flow screen — opens only mid-action)':'(parent app — see the before/after on the customer hub)')+'</div>';
    lbc.innerHTML=img+'<div class="lbinfo"><span class="x" onclick="document.getElementById(\'lb\').classList.remove(\'on\')">✕</span>'+
      '<h4>'+nd.dataset.full+(nd.dataset.p0==="1"?' <span style="font-size:11px;color:#b91c1c;font-weight:800">P0 fix</span>':'')+'</h4>'+
      '<div class="sub">'+nd.dataset.cat+' · '+nd.dataset.tab+' tab</div>'+
      '<div class="row"><b>Status</b><span class="pill" style="background:'+statusBg(app,nd.dataset.status)+';color:'+app.statusColor[nd.dataset.status]+'">'+app.label[nd.dataset.status]+'</span></div>'+
      '<div class="d">'+nd.dataset.desc+'</div>'+
      (mock?'<a class="open" style="background:#15803d" href="'+app.briefBase+mock+'" target="_blank">View redesign →</a> ':'')+
      (brief?'<a class="open" href="'+brief+'" target="_blank">Open before / after →</a>':'')+'</div>';
    lb.classList.add("on");
  });
  lb.addEventListener("click",function(e){if(e.target===lb)lb.classList.remove("on");});
  // app counts in the toggle
  document.querySelectorAll(".ac").forEach(function(sp){var a=APPS[sp.dataset.app],n=0;a.cats.forEach(function(c){n+=c.screens.length;});sp.textContent=n+" screens";});
  render("tutor");
})();
</script>
</body></html>
